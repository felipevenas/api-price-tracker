version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: price_monitor_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: price_monitor
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: price_monitor_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  chrome:
    image: selenium/standalone-chrome:latest
    container_name: price_monitor_chrome
    restart: always
    ports:
      - "4444:4444"
      - "7900:7900"
    shm_size: 2gb
    environment:
      - SE_NODE_MAX_SESSIONS=4
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - TZ=America/Sao_Paulo

  web:
    build: .
    container_name: price_monitor_web
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - REDIS_URL=redis://redis:6379/0
      - SELENIUM_HUB_URL=http://chrome:4444/wd/hub
      - TZ=America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chrome:
        condition: service_started

  celery_worker:
    build: .
    container_name: price_monitor_worker
    restart: always
    command: celery -A app.infra.queue.celery_app worker --loglevel=info
    volumes:
      - .:/code
    environment:
      - POSTGRES_SERVER=db
      - REDIS_URL=redis://redis:6379/0
      - SELENIUM_HUB_URL=http://chrome:4444/wd/hub
      - TZ=America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chrome:
        condition: service_started

  celery_beat:
    build: .
    container_name: price_monitor_beat
    restart: always
    command: celery -A app.infra.queue.celery_app beat --loglevel=info
    volumes:
      - .:/code
    environment:
      - POSTGRES_SERVER=db
      - REDIS_URL=redis://redis:6379/0
      - TZ=America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: price_monitor_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      TZ: America/Sao_Paulo
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
